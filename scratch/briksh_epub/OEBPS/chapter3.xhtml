<body>
    <div class="chapter-header">
        <div class="chapter-num">অধ্যায় 3</div>
        <h1>উপসংহার ও আগামীর ভাবনা</h1>
    </div>
    <p class="lead">সমাপ্তি কেবল একটি অধ্যায়ের শেষ নয়, বরং নতুন উপলব্ধির উন্মোচন।</p>
            <p>বইটির মাধ্যমে যে সকল প্রশ্নের উত্তর খোঁজা হয়েছে, তা আগামী প্রজন্মের গবেষক ও চিন্তাবিদদের জন্য পাথেয় হিসেবে কাজ করবে।</p>
            <p>আইডিয়া প্রকাশনের সাথে থাকার জন্য আপনাকে আন্তরিক ধন্যবাদ। সুন্দর হোক আপনার পাঠাভ্যাস।</p>
